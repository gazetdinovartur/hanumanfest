<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Главная — секция программы (локальный превью)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/hf-schedule.css" rel="stylesheet">
  <style>
    :root {
      font-family: 'Montserrat', sans-serif;
      --brand-main: #f65414;
      --brand-accent: #95a43a;
      --dark-gray: #303030;
    }
    body { background: #fff; color: var(--dark-gray); }
    .text-brand-main { color: var(--brand-main) !important; }
    .contact-link { color: var(--brand-main); text-decoration: none; }
    .contact-link:hover { color: var(--brand-accent); }
    .preview-banner {
      background: #fff8f4;
      border-bottom: 1px solid rgba(246, 84, 20, 0.2);
      font-size: 0.875rem;
    }
    .preview-banner a { color: var(--brand-main); }
  </style>
</head>
<body>
  <div class="preview-banner py-2 text-center">
    Локальный превью секции #program ·
    <a href="index.html">полная страница расписания</a>
  </div>

  <section class="schedule-section py-5 bg-light" id="program">
    <div class="container">
      <h2 class="text-center text-brand-main mb-4">Программа фестиваля</h2>

      <div class="hf-schedule" data-hf-schedule data-layout="compact">
        <div class="hf-schedule__loading text-center py-4">
          <div class="spinner-border text-brand-main" role="status">
            <span class="visually-hidden">Загрузка расписания…</span>
          </div>
        </div>
      </div>
      <p class="hf-schedule__note text-muted text-center small mt-3 mb-0">
        Возможны корректировки в расписании и расширение программы.
      </p>
      <p class="text-center mt-4 mb-0">
        <a href="index.html" class="contact-link fw-semibold">Полное расписание на отдельной странице →</a>
      </p>
    </div>
  </section>

  <script>
    window.hfSchedule = { productSlug: 'hanuman-fest' };
  </script>
  <script src="assets/hf-schedule.js"></script>
</body>
</html>

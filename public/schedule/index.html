<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Расписание — Hanuman Fest 2026 (локальный превью)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/hf-schedule.css" rel="stylesheet">
  <style>
    :root {
      font-family: 'Montserrat', sans-serif;
      --brand-main: #f65414;
      --brand-accent: #95a43a;
      --dark-gray: #303030;
    }
    body { background: #fff; color: var(--dark-gray); }
    .text-brand-main { color: var(--brand-main) !important; }
    .text-brand-accent { color: var(--brand-accent) !important; }
    .preview-banner {
      background: #fff8f4;
      border-bottom: 1px solid rgba(246, 84, 20, 0.2);
      font-size: 0.875rem;
    }
    .preview-banner a { color: var(--brand-main); }
  </style>
</head>
<body>
  <div class="preview-banner py-2 text-center">
    Локальный превью виджета · API: <code>/api</code> ·
    <a href="home.html">компактный вид (главная)</a>
  </div>

  <main class="page-content py-5">
    <div class="container hf-schedule-page">
      <h1 class="text-brand-main text-center mb-4">Программа фестиваля</h1>
      <p class="text-center text-muted mb-4">26–28 июня 2026 · Хануман-Фест</p>

      <div class="hf-schedule" data-hf-schedule data-layout="full">
        <div class="hf-schedule__loading text-center py-4">
          <div class="spinner-border text-brand-main" role="status">
            <span class="visually-hidden">Загрузка расписания…</span>
          </div>
        </div>
      </div>
      <p class="hf-schedule__note text-muted text-center small mt-3 mb-0">
        Возможны корректировки в расписании и расширение программы.
      </p>
    </div>
  </main>

  <script>
    window.hfSchedule = { productSlug: 'hanuman-fest' };
  </script>
  <script src="assets/hf-schedule.js"></script>
</body>
</html>

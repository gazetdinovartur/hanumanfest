# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.default_admin_password_hash: '$2y$12$4L1U3009ffceyxtaCcoh2efQx.XeY48u6iStryuZJsIfrOUGPjQp.'
    app.admin_password_hash: '%env(default:app.default_admin_password_hash:ADMIN_PASSWORD_HASH)%'
    env(YOOKASSA_SHOP_ID): ''
    env(YOOKASSA_SECRET_KEY): ''
    env(GOOGLE_SHEETS_WEBHOOK_URL): ''
    env(APP_URL): '%env(DEFAULT_URI)%'
    env(FRONTEND_URL): '%env(APP_URL)%'
    env(MAILER_FROM): 'noreply@example.com'
    env(MAILER_FROM_NAME): 'Hanuman Fest'
    env(CORS_ALLOW_ORIGIN): '*'
    env(MAILER_DSN): 'null://null'
    env(SCHEDULE_SHEET_URL): ''

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    App\Infrastructure\Yookassa\YookassaClient:
        arguments:
            $shopId: '%env(YOOKASSA_SHOP_ID)%'
            $secretKey: '%env(YOOKASSA_SECRET_KEY)%'
            $returnUrl: '%env(FRONTEND_URL)%/return'

    App\Infrastructure\GoogleSheets\GoogleSheetsClient:
        arguments:
            $webhookUrl: '%env(GOOGLE_SHEETS_WEBHOOK_URL)%'

    App\Service\PaymentNotificationService:
        arguments:
            $fromEmail: '%env(MAILER_FROM)%'
            $fromName: '%env(MAILER_FROM_NAME)%'
            $frontendUrl: '%env(FRONTEND_URL)%'

    App\EventListener\CorsListener:
        arguments:
            $allowOrigin: '%env(CORS_ALLOW_ORIGIN)%'

    App\Command\ImportScheduleCommand:
        arguments:
            $defaultSourceUrl: '%env(SCHEDULE_SHEET_URL)%'


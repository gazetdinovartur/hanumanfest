# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.uploads_directory: '%kernel.project_dir%/public/uploads'
    env(ADMIN_PASSWORD): 'TempAdmin!2026'
    app.admin_password: '%env(ADMIN_PASSWORD)%'
    env(YOOKASSA_SHOP_ID): ''
    env(YOOKASSA_SECRET_KEY): ''
    env(REGISTRATION_SHEET_URL): ''
    env(REGISTRATION_SHEET_URL_TEST): ''
    env(APP_URL): '%env(DEFAULT_URI)%'
    env(FRONTEND_URL): '%env(APP_URL)%'
    env(MAILER_FROM): 'noreply@example.com'
    env(MAILER_FROM_NAME): 'Hanuman Fest'
    env(CORS_ALLOW_ORIGIN): '*'
    env(MAILER_DSN): 'null://null'
    env(SCHEDULE_SHEET_URL): ''

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    App\Infrastructure\Yookassa\YookassaClient:
        arguments:
            $shopId: '%env(YOOKASSA_SHOP_ID)%'
            $secretKey: '%env(YOOKASSA_SECRET_KEY)%'
            $returnUrl: '%env(FRONTEND_URL)%/return'

    App\Infrastructure\GoogleSheets\GoogleSheetsRegistrationsReference:
        arguments:
            $configuredUrl: '%env(REGISTRATION_SHEET_URL)%'

    App\Infrastructure\GoogleSheets\GoogleSheetsTestRegistrationsReference:
        class: App\Infrastructure\GoogleSheets\GoogleSheetsRegistrationsReference
        arguments:
            $configuredUrl: '%env(REGISTRATION_SHEET_URL_TEST)%'
            $fallbackSpreadsheetId: null

    App\Admin\DashboardController:
        arguments:
            $scheduleSheetUrl: '%env(SCHEDULE_SHEET_URL)%'

    App\Infrastructure\GoogleSheets\GoogleSheetsClient:
        arguments:
            $registrations: '@App\Infrastructure\GoogleSheets\GoogleSheetsRegistrationsReference'
            $testRegistrations: '@App\Infrastructure\GoogleSheets\GoogleSheetsTestRegistrationsReference'

    App\Service\PaymentLinkService:
        arguments:
            $applicationRepository: '@App\Repository\ApplicationRepository'
            $frontendUrl: '%env(FRONTEND_URL)%'

    App\Service\PaymentNotificationService:
        arguments:
            $fromEmail: '%env(MAILER_FROM)%'
            $fromName: '%env(MAILER_FROM_NAME)%'
            $frontendUrl: '%env(FRONTEND_URL)%'

    App\EventListener\CorsListener:
        arguments:
            $allowOrigin: '%env(CORS_ALLOW_ORIGIN)%'

    App\Command\ImportScheduleCommand:
        arguments:
            $defaultSourceUrl: '%env(SCHEDULE_SHEET_URL)%'

    App\EventListener\ApiRateLimitListener:
        arguments:
            $environment: '%kernel.environment%'
            $apiPublicLimiter: '@limiter.api_public'
            $apiWriteLimiter: '@limiter.api_write'
            $apiWebhookLimiter: '@limiter.api_webhook'

    App\Service\Content\SiteContentDefaults:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\Content\GalleryUploadService:
        arguments:
            $projectDir: '%kernel.project_dir%'

framework:
    rate_limiter:
        api_public:
            policy: 'sliding_window'
            limit: 120
            interval: '1 minute'
        api_write:
            policy: 'fixed_window'
            limit: 20
            interval: '1 minute'
        api_webhook:
            policy: 'fixed_window'
            limit: 200
            interval: '1 minute'
